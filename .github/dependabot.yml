# Weekly dependency updates, grouped so they arrive as a few pull requests instead of dozens.
# Major versions (breaking changes, e.g. Capacitor 6 -> 8) are upgraded deliberately, not automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # 0.x minor releases of PGlite are breaking; the database tests need migrating first.
      - dependency-name: '@electric-sql/pglite'
        versions: ['>=0.3.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
