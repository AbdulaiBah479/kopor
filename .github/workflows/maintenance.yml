name: Maintenance
# One-click fixes for the live service, run from GitHub → Actions → Maintenance → Run workflow.
# Only these fixed actions are possible (no free-form database commands).
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options:
          - reset-guest-ai-allowance
          - unlock-locked-accounts
          - remove-test-accounts
          - issue-recovery-code
          - check-setup
          - set-owner-phone
      phone:
        description: Phone number (for issue-recovery-code or set-owner-phone), e.g. 072082348 or +23272082348
        required: false
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: hpmpbzcloklaeghekjfz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ${{ inputs.action }}
        env:
          PHONE: ${{ inputs.phone }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }
          sql() { jq -Rs '{query: .}' | curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT/database/query" \
                    -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @-; echo; }
          case "${{ inputs.action }}" in
            reset-guest-ai-allowance) echo "delete from public.ai_usage_anon where day = current_date returning 1" | sql | jq 'length' | xargs echo "Guest allowances reset:";;
            unlock-locked-accounts)   echo "delete from public.pin_attempts returning 1" | sql | jq 'length' | xargs echo "Lock records cleared:";;
            remove-test-accounts)     sql < supabase/cleanup-test-data.sql;;
            # Support for someone who lost both their PIN and their recovery code. Makes a new one-time recovery code
            # (only its salted hash is stored, the old code stops working) and unlocks the account. The person then uses
            # "Forgot your PIN?" in the app with this code. Only people with write access to this repository can run it.
            issue-recovery-code)
              # Run summaries of a public repository can be read by anyone, so the code is only ever shown in a private one.
              [ "$PRIVATE_REPO" = "true" ] || { echo "::error::This repository is public, so the code could be seen by anyone. Make it private first, or issue the code from the Owner dashboard in the app."; exit 1; }
              d=$(printf '%s' "$PHONE" | tr -cd '0-9+')
              case "$d" in +*) d=${d#+};; 00*) d=${d#00};; 232*) [ ${#d} -gt 9 ] || d=232$d;; 0*) d=232${d#0};; *) d=232$d;; esac
              [[ "$d" =~ ^[0-9]{10,15}$ ]] || { echo "::error::Give a valid phone number"; exit 1; }
              email="p$d@phone.kopor.app"
              A=ABCDEFGHJKLMNPQRSTUVWXYZ23456789
              code=$(head -c 10 /dev/urandom | od -An -tu1 | tr -s ' ' '\n' | grep -v '^$' | while read -r b; do printf '%s' "${A:$((b & 31)):1}"; done)
              salt=$(cat /proc/sys/kernel/random/uuid)
              h=$(printf '%s' "$salt:$code" | sha256sum | cut -d' ' -f1)
              acct=$(printf '%s' "$email" | sha256sum | cut -d' ' -f1)
              n=$(sql <<SQL | jq 'length'
          with u as (select id from auth.users where email = '$email'),
               r as (insert into public.recovery_codes (user_id, code_hash, salt, attempts, locked_until, updated_at)
                     select id, '$h', '$salt', 0, null, now() from u
                     on conflict (user_id) do update set code_hash = excluded.code_hash, salt = excluded.salt, attempts = 0, locked_until = null, updated_at = now()
                     returning 1),
               p as (delete from public.pin_attempts where key = 'acct:$acct' returning 1)
          select 1 from r
          SQL
              )
              [ "$n" = "1" ] || { echo "::error::No Kopor account uses +$d"; exit 1; }
              echo "Recovery code issued for +$d (shown in the run summary)."
              { echo "### Recovery code for +$d"; echo; echo "\`${code:0:5}-${code:5}\`"; echo;
                echo "In Kopor: Sign in → **Forgot your PIN?** → phone number, this code, and a new 6-digit PIN. It works once."; } >> "$GITHUB_STEP_SUMMARY";;
            # Who may open the Owner dashboard and reports inbox (KOPOR_ADMIN_PHONES). Replaces the list with this number.
            set-owner-phone)
              d=$(printf '%s' "$PHONE" | tr -cd '0-9+')
              case "$d" in +*) d=${d#+};; 00*) d=${d#00};; 232*) [ ${#d} -gt 9 ] || d=232$d;; 0*) d=232${d#0};; *) d=232$d;; esac
              [[ "$d" =~ ^[0-9]{10,15}$ ]] || { echo "::error::Give a valid phone number"; exit 1; }
              jq -n --arg v "$d" '[{name: "KOPOR_ADMIN_PHONES", value: $v}]' | curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT/secrets"                 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @- && echo "Owner dashboard phone set to +$d";;
            # Read-only: which server settings exist (names only, never their values).
            check-setup)
              names=$(curl -fsS "https://api.supabase.com/v1/projects/$PROJECT/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[].name')
              for n in KOPOR_ADMIN_PHONES KOPOR_PIN_PEPPER GROQ_API_KEY GEMINI_API_KEY OLLAMA_API_KEY CEREBRAS_API_KEY MISTRAL_API_KEY GITHUB_MODELS_TOKEN OPENROUTER_API_KEY NVIDIA_API_KEY SAMBANOVA_API_KEY HF_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN MONIME_WEBHOOK_SECRET; do
                if grep -qx "$n" <<<"$names"; then echo "set      $n"; else echo "MISSING  $n"; fi
              done | tee -a "$GITHUB_STEP_SUMMARY";;
          esac
