name: Daily reminders
# Free daily trigger for reminder notifications (Web Push): every morning at 08:00 Freetown time (UTC) it asks the
# Kopor server to send today's reminders. The server sends at most once per day, so extra runs do nothing.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send today's reminders
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }} # the public app key (already inside the app), not a secret
        run: |
          set -euo pipefail
          [ -n "$URL" ] || { echo "::error::VITE_SUPABASE_URL is not set"; exit 1; }
          curl -fsS -X POST "$URL/functions/v1/push" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H 'Content-Type: application/json' -d '{"action":"run"}' | tee -a "$GITHUB_STEP_SUMMARY"
