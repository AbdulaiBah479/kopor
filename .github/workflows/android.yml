# Builds the Android app (APK for testing, AAB for Google Play) in the cloud, so no local
# Android SDK is needed. Runs after every change to main; download "kopor-android" from the run's Artifacts.
# Test APKs are all signed with the same key (secret ANDROID_TEST_KEYSTORE), so phones install updates over the
# previous version and keep their records. Each build gets a higher version number.
name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: android
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
          VITE_SUPPORT_WHATSAPP: ${{ vars.VITE_SUPPORT_WHATSAPP }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      - name: Create Android project if missing
        run: test -d android || npx cap add android
      - name: Declare microphone and camera permissions (voice entry, receipt photos, barcode scanning)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA; do
            grep -q "android.permission.$p" "$M" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" "$M"
          done
          grep -q 'android.hardware.camera' "$M" || sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
          grep -n "uses-permission\|uses-feature" "$M"
      - run: npx cap sync android
      - name: Version number (higher on every build, so phones accept the update)
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle
      - name: Use the shared test signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::warning::ANDROID_TEST_KEYSTORE is not set: this APK cannot update earlier test installs"; exit 0; }
          mkdir -p ~/.android && printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - name: Build test APK
        working-directory: android
        run: |
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/kopor-test-${{ github.run_number }}.apk"
      - name: Build release bundle (unsigned unless signing secrets are set)
        working-directory: android
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kopor-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
