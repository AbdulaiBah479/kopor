# Builds the Android app (APK for testing, AAB for Google Play) in the cloud, so no local
# Android SDK is needed. Runs after every change to main; download "kopor-android" from the run's Artifacts.
# Test APKs are all signed with the same key (secret ANDROID_TEST_KEYSTORE), so phones install updates over the
# previous version and keep their records. Each build gets a higher version number.
name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: android
  cancel-in-progress: true

permissions:
  contents: write # to publish the test APK to the public "test-latest" download

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the change history, for the "What's new" notes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
          VITE_SUPPORT_WHATSAPP: ${{ vars.VITE_SUPPORT_WHATSAPP }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_APP_BUILD: ${{ github.run_number }} # the app compares it with the newest test build to offer updates
      - name: Create Android project if missing
        run: test -d android || npx cap add android
      - name: Declare microphone and camera permissions (voice entry, receipt photos, barcode scanning)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA; do
            grep -q "android.permission.$p" "$M" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" "$M"
          done
          grep -q 'android.hardware.camera' "$M" || sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
          grep -n "uses-permission\|uses-feature" "$M"
      - run: npx cap sync android
      - name: Version number (higher on every build, so phones accept the update)
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle
      - name: Build test APK
        working-directory: android
        run: |
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/kopor-test-${{ github.run_number }}.apk"
      - name: Sign with the shared test key and check it (so the APK updates earlier installs)
        env:
          KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::The ANDROID_TEST_KEYSTORE secret is missing"; exit 1; }
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/test.p12"
          for apk in android/app/build/outputs/apk/debug/kopor-test-*.apk; do
            "$SIGNER" sign --ks "$RUNNER_TEMP/test.p12" --ks-type PKCS12 --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "$apk"
          done
          rm -f "$RUNNER_TEMP/test.p12" android/app/build/outputs/apk/debug/*.idsig
          FP=$("$SIGNER" verify --print-certs android/app/build/outputs/apk/debug/kopor-test-*.apk | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "APK signing key: $FP"
          # Fingerprint of the key kept in C:UsersUSERkopor-signing (public information, not a secret).
          [ "$FP" = "7c3196e30c34659d6eaeddeaa2b4f89ae4d9b584a6319ffd7cdc4f4a0c900144" ] || { echo "::error::APK is not signed with the shared test key"; exit 1; }
      - name: Build release bundle (unsigned unless signing secrets are set)
        working-directory: android
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kopor-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Publish the test APK to the permanent public download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/kopor-test-*.apk | head -1)
          cp "$APK" kopor-test.apk
          gh release view test-latest >/dev/null 2>&1 || gh release create test-latest --prerelease --title "Kopor test app (latest)"             --notes "Android test build of Kopor. Install kopor-test.apk; newer builds install over it and keep your records."
          gh release upload test-latest kopor-test.apk "$APK" --clobber
          # "What's new" for the app's update card: the changes since the previous published build (the app shows the
          # lines starting with "- "). The previous build's commit is kept in a hidden marker in the notes.
          PREV=$(gh release view test-latest --json body --jq .body | grep -oE 'kopor-build-sha: [0-9a-f]{40}' | awk '{print $2}' || true)
          RANGE=$([ -n "$PREV" ] && git cat-file -e "$PREV" 2>/dev/null && echo "$PREV..HEAD" || echo "-15")
          CHANGES=$(git log $RANGE --no-merges --format='- %s' | grep -viE '^- (bump|merge|ignore|ci|chore|test)' | head -12)
          {
            echo "Android test build ${{ github.run_number }} of Kopor ($(date -u +%F)). Install kopor-test.apk; newer builds install over it and keep your records."
            echo
            echo "What's new:"
            echo "${CHANGES:-- Improvements and fixes}"
            echo
            echo "<!-- kopor-build-sha: ${{ github.sha }} -->"
          } > notes.md
          gh release edit test-latest --notes-file notes.md
          echo "Download: https://github.com/${{ github.repository }}/releases/download/test-latest/kopor-test.apk" >> "$GITHUB_STEP_SUMMARY"
