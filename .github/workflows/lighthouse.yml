name: Lighthouse
# Google Lighthouse CI scores every change for speed, accessibility, best practices and SEO on a mid-range phone
# profile. Scores are printed in the run log and the full reports are attached as an artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Lighthouse (mobile)
        run: |
          npx --yes @lhci/cli@0.15.1 collect --staticDistDir=dist --url=http://localhost/index.html --numberOfRuns=3 \
            --settings.preset=perf --settings.formFactor=mobile --settings.screenEmulation.mobile=true \
            --settings.onlyCategories=performance,accessibility,best-practices,seo || true
          npx --yes @lhci/cli@0.15.1 collect --staticDistDir=dist --url=http://localhost/index.html --numberOfRuns=1 \
            --settings.onlyCategories=accessibility,best-practices,seo || true
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('.lighthouseci').filter((f) => f.startsWith('lhr-') && f.endsWith('.json'));
            for (const f of files) {
              const r = JSON.parse(fs.readFileSync('.lighthouseci/' + f, 'utf8'));
              const s = Object.values(r.categories).map((c) => c.id + ' ' + Math.round(c.score * 100)).join(' | ');
              console.log('SCORES ' + s);
              for (const [id, a] of Object.entries(r.audits))
                if (a.score !== null && a.score < 0.9 && ['binary', 'numeric', 'metricSavings'].includes(a.scoreDisplayMode)) console.log('  NEEDS WORK ' + id + ': ' + a.title + (a.displayValue ? ' (' + a.displayValue + ')' : ''));
            }"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
